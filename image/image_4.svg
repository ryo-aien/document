<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A9B5C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">CUDA 基本実行モデル</text>
  
  <!-- Phase 1: Data Movement -->
  <g id="phase1">
    <!-- Phase label -->
    <rect x="50" y="70" width="700" height="40" fill="#FFE4B5" stroke="#DAA520" stroke-width="2" rx="5"/>
    <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#B8860B">フェーズ 1: データ移動</text>
    
    <!-- CPU -->
    <rect x="80" y="130" width="120" height="80" fill="url(#cpuGrad)" stroke="#2C5282" stroke-width="2" rx="10"/>
    <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">CPU</text>
    <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">ホスト側</text>
    <text x="140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">データ準備</text>
    
    <!-- GPU -->
    <rect x="600" y="130" width="120" height="80" fill="url(#gpuGrad)" stroke="#2D5016" stroke-width="2" rx="10"/>
    <text x="660" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GPU</text>
    <text x="660" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">メモリ</text>
    
    <!-- Arrow from CPU to GPU -->
    <path d="M 200 170 Q 400 120 600 170" stroke="#FF6B35" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B35">データコピー</text>
  </g>
  
  <!-- Phase 2: Computation -->
  <g id="phase2">
    <!-- Phase label -->
    <rect x="50" y="250" width="700" height="40" fill="#E6F3FF" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C5282">フェーズ 2: 計算（並列処理）</text>
    
    <!-- CPU (waiting) -->
    <rect x="80" y="310" width="120" height="80" fill="#D3D3D3" stroke="#808080" stroke-width="2" rx="10"/>
    <text x="140" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">CPU</text>
    <text x="140" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">待機中</text>
    <text x="140" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">他の作業可</text>
    
    <!-- GPU with threads -->
    <rect x="500" y="310" width="220" height="120" fill="url(#gpuGrad)" stroke="#2D5016" stroke-width="2" rx="10"/>
    <text x="610" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GPU カーネル実行</text>
    
    <!-- Thread blocks -->
    <g id="threads">
      <rect x="520" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="550" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="580" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="610" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="640" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="670" y="350" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      
      <rect x="520" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="550" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="580" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="610" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="640" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="670" y="370" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      
      <rect x="520" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="550" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="580" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="610" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="640" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
      <rect x="670" y="390" width="25" height="15" fill="#90EE90" stroke="#228B22" rx="2"/>
    </g>
    
    <text x="610" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">大量のスレッドが並列実行</text>
    
    <!-- Async arrow -->
    <path d="M 200 350 Q 300 320 500 350" stroke="#4A90E2" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="350" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4A90E2">非同期起動</text>
  </g>
  
  <!-- Phase 3: Result Retrieval -->
  <g id="phase3">
    <!-- Phase label -->
    <rect x="50" y="470" width="700" height="40" fill="#F0E68C" stroke="#DAA520" stroke-width="2" rx="5"/>
    <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#B8860B">フェーズ 3: 結果取得</text>
    
    <!-- CPU (active again) -->
    <rect x="80" y="530" width="120" height="50" fill="url(#cpuGrad)" stroke="#2C5282" stroke-width="2" rx="10"/>
    <text x="140" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">CPU</text>
    <text x="140" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">後処理・保存</text>
    
    <!-- GPU -->
    <rect x="600" y="530" width="120" height="50" fill="url(#gpuGrad)" stroke="#2D5016" stroke-width="2" rx="10"/>
    <text x="660" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GPU</text>
    <text x="660" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">計算完了</text>
    
    <!-- Arrow from GPU to CPU -->
    <path d="M 600 555 Q 400 520 200 555" stroke="#FF6B35" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B35">結果コピー</text>
  </g>
  
  <!-- Timeline arrow -->
  <path d="M 30 100 L 30 580" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="15" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666" transform="rotate(-90, 15, 340)">時間の流れ</text>
</svg>