<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:0.95" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="url(#backgroundGrad)"/>
  
  <!-- Title with glow effect -->
  <text x="450" y="40" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1e293b" filter="url(#glow)">GPUスレッド階層構造</text>
  <text x="450" y="65" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748b">並列処理の組織構造</text>
  
  <!-- Grid Level Card -->
  <g id="grid-level">
    <rect x="50" y="90" width="800" height="180" fill="url(#cardGrad)" stroke="url(#gridGrad)" stroke-width="3" rx="16" filter="url(#shadow)"/>
    <rect x="50" y="90" width="800" height="40" fill="url(#gridGrad)" rx="16"/>
    <rect x="50" y="114" width="800" height="16" fill="url(#gridGrad)"/>
    
    <text x="70" y="115" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">グリッド（Grid） - カーネル実行の最上位単位</text>
    
    <!-- Modern blocks -->
    <rect x="80" y="150" width="160" height="100" fill="url(#blockGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="160" y="175" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Block [0,0]</text>
    
    <rect x="260" y="150" width="160" height="100" fill="url(#blockGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="340" y="175" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Block [0,1]</text>
    
    <rect x="440" y="150" width="160" height="100" fill="url(#blockGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="520" y="175" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Block [0,2]</text>
    
    <rect x="620" y="150" width="160" height="100" fill="url(#blockGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="700" y="175" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Block [1,0]</text>
    
    <!-- Modern thread representation in first block -->
    <g id="modern-threads">
      <!-- Grid of threads with modern styling -->
      <circle cx="100" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="120" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="140" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="160" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="180" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="200" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="220" cy="195" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      
      <circle cx="100" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="120" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="140" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="160" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="180" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="200" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="220" cy="215" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      
      <circle cx="100" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="120" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="140" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="160" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="180" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="200" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
      <circle cx="220" cy="235" r="6" fill="url(#threadGrad)" opacity="0.9"/>
    </g>
    
    <!-- Dots for other blocks -->
    <text x="340" y="210" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">⋯</text>
    <text x="520" y="210" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">⋯</text>
    <text x="700" y="210" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">⋯</text>
  </g>
  
  <!-- Detailed Block View -->
  <g id="block-detail">
    <rect x="50" y="300" width="420" height="320" fill="url(#cardGrad)" stroke="url(#blockGrad)" stroke-width="3" rx="16" filter="url(#shadow)"/>
    <rect x="50" y="300" width="420" height="40" fill="url(#blockGrad)" rx="16"/>
    <rect x="50" y="324" width="420" height="16" fill="url(#blockGrad)"/>
    
    <text x="70" y="325" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">ブロック詳細構造</text>
    <text x="70" y="365" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#475569">例：16×16 = 256スレッド</text>
    
    <!-- Modern thread grid -->
    <g id="detailed-threads">
      <!-- Create a 8x8 grid for visualization -->
      <g transform="translate(80,390)">
        <!-- Row 0 -->
        <rect x="0" y="0" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="16" y="13" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[0,0]</text>
        
        <rect x="36" y="0" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="52" y="13" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[0,1]</text>
        
        <rect x="72" y="0" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="88" y="13" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[0,2]</text>
        
        <text x="120" y="13" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#64748b">⋯</text>
        
        <rect x="140" y="0" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="156" y="13" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[0,15]</text>
        
        <!-- Row 1 -->
        <rect x="0" y="24" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="16" y="37" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[1,0]</text>
        
        <rect x="36" y="24" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="52" y="37" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[1,1]</text>
        
        <rect x="72" y="24" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="88" y="37" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[1,2]</text>
        
        <text x="120" y="37" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#64748b">⋯</text>
        
        <rect x="140" y="24" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="156" y="37" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[1,15]</text>
        
        <!-- Vertical dots -->
        <text x="86" y="65" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#64748b">⋮</text>
        
        <!-- Last row -->
        <rect x="0" y="80" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="16" y="93" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[15,0]</text>
        
        <rect x="36" y="80" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="52" y="93" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[15,1]</text>
        
        <text x="120" y="93" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#64748b">⋯</text>
        
        <rect x="140" y="80" width="32" height="20" fill="url(#threadGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="4"/>
        <text x="156" y="93" text-anchor="middle" font-family="SF Mono, monospace" font-size="8" font-weight="500" fill="white">[15,15]</text>
      </g>
    </g>
    
    <!-- Feature callouts -->
    <g id="features">
      <circle cx="90" cy="520" r="4" fill="#10b981"/>
      <text x="105" y="525" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#475569">ブロック内高速通信</text>
      
      <circle cx="90" cy="540" r="4" fill="#f59e0b"/>
      <text x="105" y="545" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#475569">同期処理（__syncthreads）</text>
      
      <circle cx="90" cy="560" r="4" fill="#ef4444"/>
      <text x="105" y="565" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#475569">共有メモリアクセス</text>
    </g>
  </g>
  
  <!-- Machine Learning Example -->
  <g id="ml-example">
    <rect x="490" y="300" width="360" height="320" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="3" rx="16" filter="url(#shadow)"/>
    <rect x="490" y="300" width="360" height="40" fill="linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%)" rx="16"/>
    <rect x="490" y="324" width="360" height="16" fill="linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%)"/>
    
    <text x="510" y="325" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">実例：機械学習（行列乗算）</text>
    
    <!-- Matrix visualization -->
    <g id="matrix-example">
      <text x="510" y="365" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">計算：C = A × B</text>
      <text x="510" y="385" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" fill="#64748b">行列 A[2048×1024] × 行列 B[1024×2048]</text>
      
      <!-- Matrix A -->
      <rect x="510" y="400" width="60" height="40" fill="linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="6"/>
      <text x="540" y="415" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">A</text>
      <text x="540" y="430" text-anchor="middle" font-family="SF Mono, monospace" font-size="9" fill="rgba(255,255,255,0.8)">2048×1024</text>
      
      <!-- × symbol -->
      <text x="585" y="420" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="300" fill="#64748b">×</text>
      
      <!-- Matrix B -->
      <rect x="600" y="400" width="60" height="40" fill="linear-gradient(135deg, #ec4899 0%, #db2777 100%)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="6"/>
      <text x="630" y="415" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">B</text>
      <text x="630" y="430" text-anchor="middle" font-family="SF Mono, monospace" font-size="9" fill="rgba(255,255,255,0.8)">1024×2048</text>
      
      <!-- = symbol -->
      <text x="675" y="420" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="300" fill="#64748b">=</text>
      
      <!-- Matrix C -->
      <rect x="690" y="400" width="60" height="40" fill="linear-gradient(135deg, #10b981 0%, #059669 100%)" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="6"/>
      <text x="720" y="415" text-anchor="middle" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white">C</text>
      <text x="720" y="430" text-anchor="middle" font-family="SF Mono, monospace" font-size="9" fill="rgba(255,255,255,0.8)">2048×2048</text>
    </g>
    
    <!-- Threading strategy -->
    <g id="threading-strategy">
      <text x="510" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#8b5cf6">スレッド設計：</text>
      
      <g id="strategy-items">
        <circle cx="520" cy="490" r="3" fill="#10b981"/>
        <text x="535" y="495" font-family="SF Pro Text, -apple-system, sans-serif" font-size="12" fill="#374151">総要素数：2048 × 2048 = 4,194,304個</text>
        
        <circle cx="520" cy="510" r="3" fill="#f59e0b"/>
        <text x="535" y="515" font-family="SF Pro Text, -apple-system, sans-serif" font-size="12" fill="#374151">ブロックサイズ：16×16 = 256スレッド</text>
        
        <circle cx="520" cy="530" r="3" fill="#ef4444"/>
        <text x="535" y="535" font-family="SF Pro Text, -apple-system, sans-serif" font-size="12" fill="#374151">グリッドサイズ：128×128 = 16,384ブロック</text>
        
        <circle cx="520" cy="550" r="3" fill="#8b5cf6"/>
        <text x="535" y="555" font-family="SF Pro Text, -apple-system, sans-serif" font-size="12" fill="#374151">各スレッド：1つの C[i][j] 要素を計算</text>
      </g>
    </g>
    
    <!-- Performance highlight -->
    <rect x="510" y="570" width="320" height="35" fill="linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" rx="8"/>
    <text x="525" y="590" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8b5cf6">並列度：4,194,304スレッドが同時実行</text>
  </g>
  
  <!-- Modern Legend -->
  <g id="modern-legend">
    <rect x="50" y="640" width="800" height="50" fill="rgba(255,255,255,0.8)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1" rx="12" filter="url(#shadow)"/>
    
    <text x="70" y="660" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">階層構造：</text>
    
    <rect x="160" y="650" width="30" height="16" fill="url(#gridGrad)" rx="4"/>
    <text x="190" y="662" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" fill="#374151">グリッド（カーネル全体）</text>
    
    <rect x="350" y="650" width="30" height="16" fill="url(#blockGrad)" rx="4"/>
    <text x="380" y="662" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" fill="#374151">ブロック（スレッド群）</text>
    
    <rect x="540" y="650" width="30" height="16" fill="url(#threadGrad)" rx="4"/>
    <text x="570" y="662" font-family="SF Pro Text, -apple-system, sans-serif" font-size="13" fill="#374151">スレッド（計算単位）</text>
  </g>
  
  <!-- Connection arrow -->
  <!-- <path d="M 470 400 Q 480 350 490 400" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
  <text x="475" y="370" text-anchor="middle" font-family="SF Pro Text, -apple-system, sans-serif" font-size="11" fill="#64748b" transform="rotate(-90, 475, 370)">詳細実装</text> -->
</svg>