<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">
    LoRAとファインチューニングの詳細比較
  </text>
  
  <!-- Divider -->
  <line x1="450" y1="60" x2="450" y2="680" stroke="#ddd" stroke-width="2"/>
  
  <!-- LoRA Section -->
  <g id="lora-section">
    <!-- Section Title -->
    <rect x="20" y="70" width="410" height="40" rx="5" fill="#e3f2fd"/>
    <text x="225" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">
      LoRA
    </text>
    <text x="225" y="105" text-anchor="middle" font-size="12" fill="#666">
      Low-Rank Adaptation（低ランク適応）
    </text>
    
    <!-- Visual Representation -->
    <g transform="translate(50, 130)">
      <!-- Original Model -->
      <rect x="0" y="0" width="120" height="100" rx="10" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
      <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
        元のモデル
      </text>

      
      <!-- Plus Sign -->
      <text x="140" y="55" font-size="30" fill="#666">+</text>
      
      <!-- LoRA Adapter -->
      <rect x="170" y="20" width="80" height="60" rx="8" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2"/>
      <text x="210" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
        LoRA
      </text>
      <text x="210" y="60" text-anchor="middle" font-size="11" fill="#666">
        アダプタ
      </text>
      <text x="210" y="75" text-anchor="middle" font-size="10" fill="#4caf50">
        ~1MB
      </text>
      
      <!-- Multiple Adapters -->
      <rect x="260" y="10" width="70" height="30" rx="5" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="295" y="30" text-anchor="middle" font-size="11" fill="#333">
        タスクA用
      </text>
      
      <rect x="260" y="45" width="70" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="295" y="65" text-anchor="middle" font-size="11" fill="#333">
        タスクB用
      </text>
      
      <rect x="260" y="80" width="70" height="30" rx="5" fill="#fff9c4" stroke="#f57f17" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="295" y="100" text-anchor="middle" font-size="11" fill="#333">
        タスクC用
      </text>
    </g>
    
    <!-- Features with Icons -->
    <g transform="translate(30, 250)">
      <!-- メリット -->
      <rect x="0" y="0" width="390" height="30" rx="5" fill="#e8f5e9"/>
      <text x="195" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">
        メリット
      </text>
      
      <g transform="translate(10, 40)">
        <circle cx="8" cy="8" r="6" fill="#4caf50"/>
        <text x="20" y="12" font-size="13" fill="#333">
          <tspan font-weight="bold">省メモリ</tspan>: 元モデルの0.1%程度の追加メモリ
        </text>
        
        <circle cx="8" cy="35" r="6" fill="#4caf50"/>
        <text x="20" y="39" font-size="13" fill="#333">
          <tspan font-weight="bold">高速学習</tspan>: 数時間で学習完了（通常の1/10）
        </text>
        
        <circle cx="8" cy="62" r="6" fill="#4caf50"/>
        <text x="20" y="66" font-size="13" fill="#333">
          <tspan font-weight="bold">柔軟性</tspan>: 複数タスクのアダプタを即座に切替
        </text>
        
        <circle cx="8" cy="89" r="6" fill="#4caf50"/>
        <text x="20" y="93" font-size="13" fill="#333">
          <tspan font-weight="bold">低コスト</tspan>: 一般的なGPUで学習可能
        </text>
        
        <circle cx="8" cy="116" r="6" fill="#4caf50"/>
        <text x="20" y="120" font-size="13" fill="#333">
          <tspan font-weight="bold">共有容易</tspan>: アダプタファイルが小さく配布が簡単
        </text>
      </g>
      
      <!-- デメリット -->
      <rect x="0" y="170" width="390" height="30" rx="5" fill="#ffebee"/>
      <text x="195" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">
        デメリット
      </text>
      
      <g transform="translate(10, 210)">
        <circle cx="8" cy="8" r="6" fill="#f44336"/>
        <text x="20" y="12" font-size="13" fill="#333">
          性能がフルファインチューニングより若干劣る
        </text>
        
        <circle cx="8" cy="35" r="6" fill="#f44336"/>
        <text x="20" y="39" font-size="13" fill="#333">
          大幅な変更には不向き（微調整に特化）
        </text>
      </g>
    </g>
    
    <!-- Use Cases -->
    <rect x="30" y="530" width="390" height="30" rx="5" fill="#e3f2fd"/>
    <text x="225" y="550" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">
      適したユースケース
    </text>
    
    <g transform="translate(40, 570)">
      <rect x="0" y="0" width="180" height="40" rx="5" fill="#fff" stroke="#1976d2"/>
      <text x="90" y="16" text-anchor="middle" font-size="12" fill="#333">特定企業の文体学習</text>
      <text x="90" y="30" text-anchor="middle" font-size="11" fill="#666">（社内文書の生成）</text>
      
      <rect x="195" y="0" width="180" height="40" rx="5" fill="#fff" stroke="#1976d2"/>
      <text x="285" y="16" text-anchor="middle" font-size="12" fill="#333">多言語対応</text>
      <text x="285" y="30" text-anchor="middle" font-size="11" fill="#666">（各言語用アダプタ）</text>
      
      <rect x="0" y="50" width="180" height="40" rx="5" fill="#fff" stroke="#1976d2"/>
      <text x="90" y="66" text-anchor="middle" font-size="12" fill="#333">ドメイン適応</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#666">（業界用語・専門知識）</text>
      
      <rect x="195" y="50" width="180" height="40" rx="5" fill="#fff" stroke="#1976d2"/>
      <text x="285" y="66" text-anchor="middle" font-size="12" fill="#333">プロンプト最適化</text>
      <text x="285" y="80" text-anchor="middle" font-size="11" fill="#666">（特定タスクへの対応）</text>
    </g>
  </g>
  
  <!-- Fine-Tuning Section -->
  <g id="finetuning-section">
    <!-- Section Title -->
    <rect x="470" y="70" width="410" height="40" rx="5" fill="#ffe0b2"/>
    <text x="675" y="95" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">
      ファインチューニング
    </text>
    <text x="675" y="105" text-anchor="middle" font-size="12" fill="#666">
      Full Fine-Tuning（全体調整）
    </text>
    
    <!-- Visual Representation -->
    <g transform="translate(500, 130)">
      <!-- Original Model -->
      <rect x="0" y="0" width="120" height="100" rx="10" fill="#bbdefb" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
        元のモデル
      </text>

      
      <!-- Arrow -->
      <path d="M 125 50 L 165 50" stroke="#f57c00" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
      <text x="145" y="45" text-anchor="middle" font-size="10" fill="#f57c00">全体を更新</text>
      
      <!-- Fine-tuned Model -->
      <rect x="170" y="0" width="120" height="100" rx="10" fill="#ffe0b2" stroke="#f57c00" stroke-width="3"/>
      <text x="230" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
        特化モデル
      </text>
      <text x="230" y="45" text-anchor="middle" font-size="11" fill="#666">
        全パラメータ
      </text>
      <text x="230" y="60" text-anchor="middle" font-size="11" fill="#666">
        更新済み
      </text>
      <text x="230" y="80" text-anchor="middle" font-size="10" fill="#d84315">
        元モデルと同サイズ
      </text>
      <text x="230" y="95" text-anchor="middle" font-size="10" fill="#d84315">
        (数GB〜数百GB)
      </text>
    </g>
    
    <!-- Features with Icons -->
    <g transform="translate(480, 250)">
      <!-- メリット -->
      <rect x="0" y="0" width="390" height="30" rx="5" fill="#e8f5e9"/>
      <text x="195" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">
        メリット
      </text>
      
      <g transform="translate(10, 40)">
        <circle cx="8" cy="8" r="6" fill="#4caf50"/>
        <text x="20" y="12" font-size="13" fill="#333">
          <tspan font-weight="bold">最高性能</tspan>: タスクに完全最適化
        </text>
        
        <circle cx="8" cy="35" r="6" fill="#4caf50"/>
        <text x="20" y="39" font-size="13" fill="#333">
          <tspan font-weight="bold">大幅な変更</tspan>: モデルの動作を根本から変更可能
        </text>
        
        <circle cx="8" cy="62" r="6" fill="#4caf50"/>
        <text x="20" y="66" font-size="13" fill="#333">
          <tspan font-weight="bold">独立動作</tspan>: 追加モジュール不要で単体動作
        </text>
        
        <circle cx="8" cy="89" r="6" fill="#4caf50"/>
        <text x="20" y="93" font-size="13" fill="#333">
          <tspan font-weight="bold">専門性</tspan>: 特定分野の深い知識を獲得
        </text>
        
        <circle cx="8" cy="116" r="6" fill="#4caf50"/>
        <text x="20" y="120" font-size="13" fill="#333">
          <tspan font-weight="bold">商用利用</tspan>: 独自モデルとして販売・提供可能
        </text>
      </g>
      
      <!-- デメリット -->
      <rect x="0" y="170" width="390" height="30" rx="5" fill="#ffebee"/>
      <text x="195" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">
        デメリット
      </text>
      
      <g transform="translate(10, 210)">
        <circle cx="8" cy="8" r="6" fill="#f44336"/>
        <text x="20" y="12" font-size="13" fill="#333">
          高コスト: 大量のGPUメモリ・計算資源が必要
        </text>
        
        <circle cx="8" cy="35" r="6" fill="#f44336"/>
        <text x="20" y="39" font-size="13" fill="#333">
          学習時間: 数日〜数週間かかる場合も
        </text>
        
        <circle cx="8" cy="62" r="6" fill="#f44336"/>
        <text x="20" y="66" font-size="13" fill="#333">
          保存容量: モデル全体を保存（数十GB）
        </text>
      </g>
    </g>
    
    <!-- Use Cases -->
    <rect x="480" y="530" width="390" height="30" rx="5" fill="#ffe0b2"/>
    <text x="675" y="550" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">
      適したユースケース
    </text>
    
    <g transform="translate(490, 570)">
      <rect x="0" y="0" width="180" height="40" rx="5" fill="#fff" stroke="#f57c00"/>
      <text x="90" y="16" text-anchor="middle" font-size="12" fill="#333">医療診断AI</text>
      <text x="90" y="30" text-anchor="middle" font-size="11" fill="#666">（専門知識の獲得）</text>
      
      <rect x="195" y="0" width="180" height="40" rx="5" fill="#fff" stroke="#f57c00"/>
      <text x="285" y="16" text-anchor="middle" font-size="12" fill="#333">法律相談AI</text>
      <text x="285" y="30" text-anchor="middle" font-size="11" fill="#666">（法律知識の習得）</text>
      
      <rect x="0" y="50" width="180" height="40" rx="5" fill="#fff" stroke="#f57c00"/>
      <text x="90" y="66" text-anchor="middle" font-size="12" fill="#333">カスタマーサポート</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#666">（企業専用AI）</text>
      
      <rect x="195" y="50" width="180" height="40" rx="5" fill="#fff" stroke="#f57c00"/>
      <text x="285" y="66" text-anchor="middle" font-size="12" fill="#333">コード生成特化</text>
      <text x="285" y="80" text-anchor="middle" font-size="11" fill="#666">（プログラミング専門）</text>
    </g>
  </g>
  
  <!-- Bottom Summary -->
  <rect x="50" y="670" width="350" height="25" rx="5" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="225" y="687" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">
     軽量・高速・マルチタスク向け
  </text>
  
  <rect x="500" y="670" width="350" height="25" rx="5" fill="#ffe0b2" stroke="#f57c00"/>
  <text x="675" y="687" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">
     高性能・専門特化・商用展開向け
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f57c00"/>
    </marker>
  </defs>
</svg>