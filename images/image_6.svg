<svg viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="economicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfdf7"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    
    <linearGradient id="marketingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    
    <linearGradient id="organizationalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    
    <!-- シャドウフィルター -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="1700" fill="#f8fafc"/>
  
  <!-- ヘッダーセクション -->
  <rect x="40" y="40" width="1120" height="120" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="40" y="40" width="6" height="120" rx="3" fill="#1e40af"/>
  
  <!-- ヘッダーテキスト -->
  <text x="70" y="85" font-family="Segoe UI, sans-serif" font-size="32" font-weight="600" fill="#1e40af">🚀 AI開発のメリット</text>
  <text x="70" y="115" font-family="Segoe UI, sans-serif" font-size="18" fill="#64748b">ChatGPTなど、AIツールがある環境で、独自AI開発の必要性と強みについて</text>
  
  <!-- 3つの軸セクション -->
  <rect x="40" y="200" width="1120" height="200" rx="12" fill="white" filter="url(#shadow)" stroke="#e2e8f0"/>
  <text x="60" y="230" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#1e40af">独自開発価値による3つの軸</text>
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#f1f5f9" stroke-width="2"/>
  
  <!-- 経済的メリット円 -->
  <circle cx="200" cy="310" r="50" fill="url(#economicGrad)" stroke="#059669" stroke-width="2"/>
  <circle cx="200" cy="310" r="35" fill="#059669"/>
  <text x="200" y="318" font-family="Segoe UI, sans-serif" font-size="24" fill="white" text-anchor="middle">💰</text>
  <text x="200" y="380" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">経済的メリット</text>
  
  <!-- マーケティングメリット円 -->
  <circle cx="600" cy="310" r="50" fill="url(#marketingGrad)" stroke="#dc2626" stroke-width="2"/>
  <circle cx="600" cy="310" r="35" fill="#dc2626"/>
  <text x="600" y="318" font-family="Segoe UI, sans-serif" font-size="24" fill="white" text-anchor="middle">📈</text>
  <text x="600" y="380" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">マーケティングメリット</text>
  
  <!-- 組織メリット円 -->
  <circle cx="1000" cy="310" r="50" fill="url(#organizationalGrad)" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="1000" cy="310" r="35" fill="#7c3aed"/>
  <text x="1000" y="318" font-family="Segoe UI, sans-serif" font-size="24" fill="white" text-anchor="middle">🏢</text>
  <text x="1000" y="380" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">組織メリット</text>
  
  <!-- 経済的メリット詳細セクション -->
  <rect x="40" y="440" width="1120" height="300" rx="12" fill="white" filter="url(#shadow)" stroke="#e2e8f0"/>
  
  <!-- セクションヘッダー -->
  <rect x="60" y="460" width="50" height="50" rx="12" fill="url(#economicGrad)"/>
  <text x="85" y="490" font-family="Segoe UI, sans-serif" font-size="20" fill="white" text-anchor="middle">💰</text>
  <text x="130" y="490" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#1e293b">経済的メリット</text>
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#059669" stroke-width="3"/>
  
  <!-- 経済的メリットアイテム -->
  <rect x="80" y="540" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#059669" stroke-left-width="4"/>
  <circle cx="90" cy="550" r="3" fill="#059669"/>
  <text x="100" y="555" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">ライセンス費の削減</text>
  <text x="90" y="575" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">外部SaaS（ChatGPT API等）を</text>
  <text x="90" y="590" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">大量に呼び出す場合、トークン</text>
  <text x="90" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">課金が累積(従量課金制)コストを圧迫。</text>
  <text x="90" y="620" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">同等機能のツールを開発すれば</text>
  <text x="90" y="635" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">変動費を固定費化でき</text>
  <text x="90" y="650" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">コスト平準化と予算の予測が可能。</text>
  
  <rect x="360" y="540" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#059669" stroke-left-width="4"/>
  <circle cx="370" cy="550" r="3" fill="#059669"/>
  <text x="380" y="555" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">スケールと学習の経済</text>
  <text x="370" y="575" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">利用が増えるほどデータが蓄積しモデル精度向上</text>
  <text x="370" y="590" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">プロダクトの横展開により</text>
  <text x="370" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">開発のドキュメントにより</text>
  <text x="370" y="620" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">スケールアップが可能になります。</text>

  
  <rect x="640" y="540" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#059669" stroke-left-width="4"/>
  <circle cx="650" cy="550" r="3" fill="#059669"/>
  <text x="660" y="555" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">スケールメリットと資産化</text>
  <text x="650" y="575" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">モデルやツール自体が資産として</text>
  <text x="650" y="590" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">貸借対照表に計上できる場合が</text>
  <text x="650" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">あり、将来的な企業価値評価</text>
  <text x="650" y="620" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">も寄与します</text>
  
  <rect x="900" y="540" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#059669" stroke-left-width="4"/>
  <circle cx="910" cy="550" r="3" fill="#059669"/>
  <text x="920" y="555" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">最適化による投資効率の向上</text>
  <text x="910" y="575" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">タスク特化型に絞った小規模</text>
  <text x="910" y="590" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">モデルや推論を</text>
  <text x="910" y="605" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">自社用に量子化することで</text>
  <text x="910" y="620" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">推論コストをさらに引き下げつつ</text>
  <text x="910" y="635" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">精度も担保できます。</text>
  <text x="910" y="650" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">(マルチタスクのモデルはサイズが大きく</text>
  <text x="910" y="665" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">推論コストが高い)</text>
  
  <!-- マーケティングメリット詳細セクション -->
  <rect x="40" y="780" width="1120" height="300" rx="12" fill="white" filter="url(#shadow)" stroke="#e2e8f0"/>
  
  <!-- セクションヘッダー -->
  <rect x="60" y="800" width="50" height="50" rx="12" fill="url(#marketingGrad)"/>
  <text x="85" y="830" font-family="Segoe UI, sans-serif" font-size="20" fill="white" text-anchor="middle">📈</text>
  <text x="130" y="830" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#1e293b">マーケティングメリット</text>
  <line x1="60" y1="860" x2="1140" y2="860" stroke="#dc2626" stroke-width="3"/>
  
  <!-- マーケティングメリットアイテム -->
  <rect x="80" y="880" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#dc2626" stroke-left-width="4"/>
  <circle cx="90" cy="890" r="3" fill="#dc2626"/>
  <text x="100" y="895" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">差別化されたブランドストーリー</text>
  <text x="90" y="915" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">「AI開発プロジェクトを保有」のメッセージは、</text>
  <text x="90" y="930" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">技術先進性を示すPR素材に</text>
  <text x="90" y="945" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">なりやすく、AIエンジニア獲得</text>
  <text x="90" y="960" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">への説得力が増します。</text>
  
  <rect x="360" y="880" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#dc2626" stroke-left-width="4"/>
  <circle cx="370" cy="890" r="3" fill="#dc2626"/>
  <text x="380" y="895" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">仕様設計のコントロール</text>
  <text x="370" y="915" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">UI／UXなどを</text>
  <text x="370" y="930" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">自分たちで細かく調整できるため</text>
  <text x="370" y="945" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">社内ニーズや業務に合わせた</text>
  <text x="370" y="960" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">設計が可能です。</text>
  
  <rect x="640" y="880" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#dc2626" stroke-left-width="4"/>
  <circle cx="650" cy="890" r="3" fill="#dc2626"/>
  <text x="660" y="895" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">データネットワーク効果の内製化</text>
  <text x="650" y="915" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">利用体験やフィードバックを</text>
  <text x="650" y="930" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">自社側で直接収集・改善ループ</text>
  <text x="650" y="945" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">に回せるため、精度改善が</text>
  <text x="650" y="960" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">競争優位に直結します。</text>
  
  <rect x="900" y="880" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#dc2626" stroke-left-width="4"/>
  <circle cx="910" cy="890" r="3" fill="#dc2626"/>
  <text x="920" y="895" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">パートナーシップ拡張</text>
  <text x="910" y="915" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">API公開やSDK提供を通じて</text>
  <text x="910" y="930" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">エコシステムを構築でき、</text>
  <text x="910" y="945" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">サードパーティ連携→</text>
  <text x="910" y="960" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">マーケットプレイス→囲い込み</text>
  <text x="910" y="975" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">というB2B2X施策を取りやすくなります。</text>
  
  <!-- 組織メリット詳細セクション -->
  <rect x="40" y="1120" width="1120" height="300" rx="12" fill="white" filter="url(#shadow)" stroke="#e2e8f0"/>
  
  <!-- セクションヘッダー -->
  <rect x="60" y="1140" width="50" height="50" rx="12" fill="url(#organizationalGrad)"/>
  <text x="85" y="1170" font-family="Segoe UI, sans-serif" font-size="20" fill="white" text-anchor="middle">🏢</text>
  <text x="130" y="1170" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#1e293b">企業（組織）メリット</text>
  <line x1="60" y1="1200" x2="1140" y2="1200" stroke="#7c3aed" stroke-width="3"/>
  
  <!-- 組織メリットアイテム -->
  <rect x="80" y="1220" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#7c3aed" stroke-left-width="4"/>
  <circle cx="90" cy="1230" r="3" fill="#7c3aed"/>
  <text x="100" y="1235" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">機密データのガバナンス</text>
  <text x="90" y="1255" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">社外APIへ送信せずに済むため、</text>
  <text x="90" y="1270" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">機密情報や個人情報のリーク</text>
  <text x="90" y="1285" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">リスクを低減し</text>
  <text x="90" y="1300" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">コンプライアンス対応が</text>
  <text x="90" y="1315" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">容易になります。</text>
  
  <rect x="360" y="1220" width="260" height="160" rx="10" fill="#f8fafc" stroke-left="#7c3aed" stroke-left-width="4"/>
  <circle cx="370" cy="1230" r="3" fill="#7c3aed"/>
  <text x="380" y="1235" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">技術蓄積と人材育成</text>
  <text x="370" y="1255" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">モデル開発・MLOps・RAG・</text>
  <text x="370" y="1270" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">推論基盤などの知見が</text>
  <text x="370" y="1285" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">社内に残り、エンジニアの</text>
  <text x="370" y="1300" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">スキルアップやリテンション</text>
  <text x="370" y="1315" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">向上にも寄与します。</text>
  
  <rect x="640" y="1220" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#7c3aed" stroke-left-width="4"/>
  <circle cx="650" cy="1230" r="3" fill="#7c3aed"/>
  <text x="660" y="1235" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">事業継続性の向上</text>
  <text x="650" y="1255" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">外部サービスの価格改定や</text>
  <text x="650" y="1270" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">サービス停止の影響を</text>
  <text x="650" y="1285" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">受けにくくなり</text>
  <text x="650" y="1300" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">自社で定義・保証できます。</text>
  <text x="650" y="1315" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">(AIのリリースサイクルは早く</text>
  <text x="650" y="1330" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">予測が難しい)</text>
  
  <rect x="900" y="1220" width="240" height="160" rx="10" fill="#f8fafc" stroke-left="#7c3aed" stroke-left-width="4"/>
  <circle cx="910" cy="1230" r="3" fill="#7c3aed"/>
  <text x="920" y="1235" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">戦略的柔軟性</text>
  <text x="910" y="1255" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">新規AI開発事業の際でも</text>
  <text x="910" y="1270" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">AI基盤を流用して</text>
  <text x="910" y="1285" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">迅速にPoC→本番投入が可能。</text>
  <text x="910" y="1300" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">プロダクトライン全体の</text>
  <text x="910" y="1315" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">柔軟性が向上します。</text>
  
</svg>